<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Orders — Six things. One order. One shot.</title>
<meta name="description" content="A daily ranking puzzle. Put six things in order. You get one attempt, then you find out the real numbers." />
<meta name="theme-color" content="#FFF6E9" />

<!-- Link previews are half the share loop; a bare URL in a group chat converts far worse. -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Orders — Six things. One order. One shot." />
<meta property="og:description" content="Put six things in order. One attempt a day, then the real numbers." />
<meta property="og:url" content="https://orders.game" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Orders — Six things. One order. One shot." />
<meta name="twitter:description" content="Put six things in order. One attempt a day, then the real numbers." />

<link rel="icon" href="./icon.svg" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon.svg" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <button class="icon-btn" data-open="help" aria-label="How to play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M9.3 9.2a2.8 2.8 0 1 1 3.4 2.8v1.7"/><circle cx="12" cy="17.2" r="1.05" class="solid"/></svg>
    </button>
    <h1 class="wordmark">Orders</h1>
    <div class="topbar__right">
      <button class="icon-btn" data-open="archive" aria-label="Past puzzles">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 9.6h17M8.4 3.2v3.4M15.6 3.2v3.4"/></svg>
      </button>
      <button class="icon-btn" data-open="stats" aria-label="Your record">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-5"/></svg>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="rewind" id="rewind" hidden>
      <span id="rewind-label"></span>
      <button class="rewind__back" data-today>Back to today</button>
    </div>

    <section class="prompt" aria-live="polite">
      <p class="prompt__eyebrow"><span id="puzzle-no"></span></p>
      <h2 class="prompt__text" id="prompt-text">Loading…</h2>
      <p class="prompt__hint"><span id="prompt-hint"></span></p>
    </section>

    <ol class="board" id="board" aria-label="Your order. Drag rows, or focus a row and press Space then the arrow keys."></ol>

    <div class="actions">
      <button class="btn btn--primary" id="submit" disabled>Lock in my order</button>
      <p class="oneshot" id="oneshot">One attempt. No takebacks.</p>
    </div>
  </main>

  <p class="footnote" id="footnote"></p>
</div>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <button class="sheet__close icon-btn" data-close aria-label="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="sheet__body" id="sheet-body"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
